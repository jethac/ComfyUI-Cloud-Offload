[project]
name = "cloud-offload"
description = "Run selected ComfyUI nodes on rented cloud GPUs as a visible, editable Cloud Offload box, with live progress, previews, and errors relayed in place."
version = "0.2.1"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "safetensors>=0.4",
]

[project.urls]
Repository = "https://github.com/jethac/ComfyUI-Cloud-Offload"
"Bug Tracker" = "https://github.com/jethac/ComfyUI-Cloud-Offload/issues"

[tool.comfy]
PublisherId = "jethac"
DisplayName = "Cloud Offload"
